<title>Nancy — After Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF30CC;
    --pink-dark: #D231CB;
    --ink: #1A1A1A;
    --font-sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --font-display: 'Fraunces', 'Times New Roman', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: #fff;
    background: #000;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; }

  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url('https://hellonancy.com/cdn/shop/files/WhatsAppImage2023-11-18at14.19.19_2acc31e8.webp');
    background-size: cover;
    background-position: center;
    filter: brightness(0.45) saturate(1.1) blur(2px);
    transform: scale(1.08);
    z-index: 0;
  }
  .stage::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.75) 100%);
    z-index: 1;
  }
  .inner {
    position: relative;
    z-index: 2;
    max-width: 820px;
    text-align: center;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 28px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(40px, 7vw, 84px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 28px;
  }
  h1 em {
    font-style: italic;
    color: var(--pink);
    font-weight: 500;
  }
  .lede {
    font-size: clamp(16px, 1.6vw, 19px);
    color: rgba(255,255,255,0.88);
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }
  .cta {
    display: inline-block;
    background: var(--pink);
    color: #fff;
    padding: 20px 44px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.01em;
    box-shadow: 0 18px 40px -10px rgba(255,48,204,0.6);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 22px 50px -10px rgba(255,48,204,0.75); }
  .micro {
    margin-top: 22px;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .micro span { color: var(--pink); }
</style>
</head>
<body>
  <section class="stage">
    <div class="inner">
      <div class="eyebrow">Nancy · After Hours</div>
      <h1>Slow down.<br/>Turn the lights <em>low</em>.</h1>
      <p class="lede">Set the mood, breathe out the day, and meet the part of you that only comes out when no one is watching.</p>
      <a class="cta" href="https://get.hellonancy.com/products/lem">Meet Lem &nbsp;→</a>
      <div class="micro">★★★★★ &nbsp;<span>15,000+</span> five-star nights</div>
    </div>
  </section>
</body>
</html>
