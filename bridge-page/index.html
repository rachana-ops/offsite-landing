<style>
  @font-face {
    font-family: "ES Rebond Grotesque";
    src: url("https://cdn.prod.website-files.com/62d16842feb6841eb61fae8e/62d16f7c41b1e19e20468caa_ESRebondGrotesque-Regular.ttf") format("truetype");

  }

  @font-face {
    font-family: "ES Rebond Grotesque";

    font-style: normal;
    font-weight: 600;
    font-display: swap;
  }

  @font-face {
    font-family: "ES Rebond Grotesque";
    src: url("https://cdn.prod.website-files.com/62d16842feb6841eb61fae8e/62d16f7cbf6952ba3af77f1e_ESRebondGrotesque-Bold.ttf") format("truetype");
    font-style: normal;
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --magenta: #ff30cc;
    --font-display: "ES Rebond Grotesque", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    color: #333;
    background: var(--magenta);
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 400;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .bridge {
    background-image: url("https://cdn.prod.website-files.com/62d16842feb6841eb61fae8e/64425c8b3d142e2fa6b25262_62d2b5d5b7f9bc8152207f78_bg-image-min%20(1).webp"), linear-gradient(var(--magenta), var(--magenta));
    background-position: 50%, 0 0;
    background-repeat: no-repeat, repeat;
    background-size: cover, auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .bridge-container {
    width: 100%;
    max-width: 940px;
    margin-right: auto;
    margin-left: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .bridge-copy {
    display: flex;
    max-width: 600px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
  }

  .bridge-title {
    width: auto;
    color: #fff;
    text-align: center;
    font-family: var(--font-display);
    font-size: 6rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .bridge-title-accent {
    color: var(--magenta);
  }

  .bridge-description {
    color: #fff;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 400;
  }

  .bridge-cta {
    display: inline-block;
    color: #fff;
    background-color: var(--magenta);
    border-radius: 20px;
    padding: 12px 30px;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    line-height: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
  }

  .bridge-cta:active { transform: scale(0.97); }
  .bridge-cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  @media screen and (max-width: 991px) {
    .bridge-container { max-width: 728px; }
    .bridge-copy { max-width: 480px; }
    .bridge-title { font-size: 3.75rem; }
    .bridge-cta { font-size: 1.25rem; }
  }

  @media screen and (max-width: 767px) {
    .bridge-container { max-width: none; }
  }

  @media screen and (max-width: 479px) {
    .bridge-copy { max-width: 350px; }
    .bridge-title { font-size: 3rem; line-height: 1.2; }
    .bridge-description { font-size: 1rem; line-height: 1.8; }
    .bridge-cta { font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bridge-cta { transition: none; }
  }
